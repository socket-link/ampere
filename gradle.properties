#Gradle
org.gradle.jvmargs=-Xmx4096M -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.caching=true
org.gradle.parallel=true

#Kotlin
kotlin.code.style=official

#MPP
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2

#Android
android.useAndroidX=true
android.compileSdk=36
android.targetSdk=36
android.minSdk=24

#Versions
kotlin.version=2.3.10
agp.version=8.12.0
compose.version=1.10.1
ktor.version=3.3.0
sqldelight.version=2.2.1
# Phosphor (phosphor-core, phosphor-lumos), read by every module that depends on it. One declaration:
# a module compiled against another version still runs on the one Gradle resolves (AMPR-477).
phosphorVersion=0.10.0

#Ampere
ampereVersion=0.24.0
