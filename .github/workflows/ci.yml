name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The macOS jobs below are the scarcest resource in this repo: the Team plan allows 5 concurrent
# macOS jobs org-wide and each CI run asks for 2 of them. With ~6 runs in flight the queue was
# consistently as long as the running set, so a force-push used to add two more macOS jobs rather
# than replace the two it superseded. Cancel superseded PR runs; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which halves of CI does this change actually need? Only the iOS jobs are gated on this — they
  # are the ones that queue. The ubuntu jobs are cheap and always run, so a wrong answer here can
  # never let an untested Kotlin change through the JVM gate.
  #
  # The list is an ignore-list on purpose: anything not named here counts as iOS-relevant. Adding
  # a path is a decision to stop testing it on iOS, so the failure mode of forgetting to update it
  # is a wasted runner, not a missed regression.
  changes:
    name: Detect iOS-relevant changes
    runs-on: ubuntu-latest

    outputs:
      ios: ${{ steps.filter.outputs.ios }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether iOS jobs need to run
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # A first push to a branch reports an all-zero "before", and a shallow/forced history can
          # leave the base unreachable. Both mean "we cannot tell" -> run the iOS jobs.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "Cannot resolve base commit; running iOS jobs."
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # Paths that cannot affect the Kotlin/Native or Swift build.
          RELEVANT=$(echo "$CHANGED" | grep -Ev \
            -e '^docs/' \
            -e '^\.context/' \
            -e '^assets/' \
            -e '^scripts/' \
            -e '^\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE)' \
            -e '\.md$' \
            -e '^LICENSE' \
            -e '^\.gitignore$' \
            || true)

          if [ -z "$RELEVANT" ]; then
            echo "Documentation-only change; skipping iOS jobs."
            echo "ios=false" >> "$GITHUB_OUTPUT"
          else
            echo "iOS-relevant files changed:"
            echo "$RELEVANT" | sed 's/^/  /'
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

  jvm-lint-build:
    name: JVM Lint + Build (ubuntu, JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Only main writes Gradle caches. The repo was sitting at 10.9GB against a 10GB Actions cache
      # quota, so every new entry evicted an older one and the expensive ~/.konan buckets were gone
      # before the next run could read them. PR branches cannot share cache entries with each other
      # anyway — a PR reads its own ref and main — so writing from PRs bought nothing and cost the
      # quota that made main's entries survivable.
      #
      # cache-cleanup prunes dependencies and transforms the job did not touch before main saves
      # its entry. The transforms bucket had grown to ~1.4GB; on ubuntu that restores in ~10s, but
      # the same entry on the macOS runner takes ~2m at its 20-35MB/s, so keeping it lean matters.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      # setup-gradle's Gradle Home cache covers 'caches' and 'notifications' only — the wrapper's
      # distribution is not among them, so every job re-fetched the ~130MB
      # gradle-8.13-bin.zip from services.gradle.org before Gradle could start. That download
      # failed mid-handshake on three consecutive macos runs and took the Swift bridge job with
      # it, and it is dead weight on every healthy run besides.
      #
      # Exact match, no restore-keys: a distribution for a different wrapper version cannot be
      # used, so restoring one would pay the download anyway and churn the cache for nothing. A
      # clean miss is the right failure mode — it costs exactly what today already costs.
      #
      # Jobs that miss together will all try to save the same key; the first wins and the rest
      # log "cache already exists", which is a warning and not a failure.
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          anthropic_api_key=placeholder
          google_api_key=placeholder
          openai_api_key=placeholder
          EOF

      # Named compile tasks, not `assemble`. On a KMP module `assemble` on ubuntu also compiled the
      # three iOS klib targets (Kotlin/Native compiles klibs on Linux; only linking needs Xcode),
      # the JS and wasm *production executables* (webpack, binaryen, an npm install), and the
      # Android release AAR — 7-8 of this step's 11 minutes on a build-cache miss, none of it read
      # by any later job. The test jobs use the debug Android variant and the JVM target; the
      # macOS job compiles the one iOS target it needs itself.
      #
      # compileKotlinJs and compileKotlinWasmJs stay: they are seconds from cache and are the only
      # ubuntu-side check that commonMain still compiles for a non-JVM target.
      #
      # :ampere-desktop was never in the old assemble list, so a desktop-only break (AMPR-469
      # shape) could merge green. ~15s to close that.
      - name: Lint and compile JVM/Android modules
        timeout-minutes: 15
        run: >
          ./gradlew ktlintCheck verifyPublishWorkflowCoverage
          :ampere-core:compileKotlinJvm :ampere-core:compileDebugKotlinAndroid
          :ampere-core:compileKotlinJs :ampere-core:compileKotlinWasmJs
          :ampere-core-test-fixtures:compileKotlinJvm
          :ampere-cli:compileKotlinJvm
          :ampere-compose:compileKotlinJvm :ampere-compose:compileDebugKotlinAndroid
          :ampere-desktop:compileKotlinJvm
          :ampere-eval:compileKotlinJvm
          :ampere-phosphor:compileKotlinJvm
          :ampere-work-linear:compileKotlinJvm

  # No `needs: jvm-lint-build`. PR branches read the Gradle cache only, so a test job never saw
  # lint-build's compiled classes anyway — every one of them recompiles its module from main's
  # cache (compileKotlinJvm 19s in the ampere-core job's log). Waiting bought nothing but the
  # lint job's whole duration on the critical path: the required JVM check landed at ~16m where
  # the slowest test job alone is ~5m. What it cost was five ubuntu runners on a ktlint failure,
  # and ubuntu minutes are the cheap resource here.
  jvm-test:
    name: JVM + Android Tests (${{ matrix.module }}, JDK 21)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: ampere-core
            tasks: ":ampere-core:jvmTest :ampere-core:testDebugUnitTest"
          - module: ampere-cli
            tasks: ":ampere-cli:jvmTest"
          - module: ampere-compose
            tasks: ":ampere-compose:jvmTest :ampere-compose:testDebugUnitTest"
          - module: ampere-eval
            tasks: ":ampere-eval:jvmTest"
          - module: ampere-work-linear
            tasks: ":ampere-work-linear:jvmTest"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # See "Cache Gradle distribution" in jvm-lint-build for why this is not covered by
      # setup-gradle's own cache.
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          anthropic_api_key=placeholder
          google_api_key=placeholder
          openai_api_key=placeholder
          EOF

      - name: Run JVM + Android tests
        timeout-minutes: 20
        run: ./gradlew ${{ matrix.tasks }}

  # AMPR-187: AMPERE's own eval suite, replayed against its committed golden traces. Its own job
  # rather than a line in the matrix above, so a red build here reads as "an Arc's behavior changed"
  # rather than "something in ampere-eval broke" — the two want very different responses.
  #
  # Replay mode only, and structurally so: the suite opens its Bench without a live relay and
  # without liveModeEnabled, so Live mode is refused rather than merely unused. No API key, no
  # network, no writable directory beyond a temp one.
  #
  # Cheap ubuntu job. The scarce CI resource in this repo is macOS concurrency, not ubuntu minutes,
  # so the few seconds of overlap with :ampere-eval:jvmTest is worth the separate signal.
  eval-replay-gate:
    name: Eval Replay Gate (ubuntu, JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # See "Cache Gradle distribution" in jvm-lint-build for why this is not covered by
      # setup-gradle's own cache.
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          anthropic_api_key=placeholder
          google_api_key=placeholder
          openai_api_key=placeholder
          EOF

      - name: Replay the eval suite against its golden traces
        timeout-minutes: 15
        run: ./gradlew :ampere-eval:evalReplay

      - name: Explain a red gate
        if: failure()
        run: |
          cat <<'EOF'
          The eval suite no longer matches its golden traces.

          An Arc's observable behavior changed. Read the failure above: it names the probe, the
          meter, and for a conformance failure the first trace position that stopped matching.

          If the change was intended, re-record and commit the diff:
            ./gradlew :ampere-eval:recordGoldenTraces
            git diff ampere-eval/src/jvmTest/resources/golden

          See ampere-eval/README.md for what each probe measures and why.
          EOF

  jvm-tests-status:
    name: JVM + Android Tests (ubuntu, JDK 21)
    needs: [ jvm-lint-build, jvm-test, eval-replay-gate ]
    runs-on: ubuntu-latest
    if: always()

    steps:
      # eval-replay-gate is aggregated here as well as standing on its own: this job is the
      # configured required check, so wiring the gate into it is what actually blocks a merge.
      - name: Check required jobs succeeded
        run: |
          if [ "${{ needs.jvm-lint-build.result }}" != "success" ] \
            || [ "${{ needs.jvm-test.result }}" != "success" ] \
            || [ "${{ needs.eval-replay-gate.result }}" != "success" ]; then
            echo "jvm-lint-build: ${{ needs.jvm-lint-build.result }}"
            echo "jvm-test: ${{ needs.jvm-test.result }}"
            echo "eval-replay-gate: ${{ needs.eval-replay-gate.result }}"
            exit 1
          fi

  # The iOS surface is two macOS jobs again: the Kotlin tests (commonTest/nativeTest compiled and
  # run on Native) and the Kotlin<->Swift Arc bridge (AMPR-243).
  #
  # History, because it matters for when to undo this: they were two jobs, then one. The merge
  # was made when ~6 runs were in flight against the Team plan's 5 concurrent macOS jobs, and two
  # jobs per run meant the macOS half of every run sat queued behind the others. That queue is
  # gone — the iOS job started within 11s of creation in 27 of the last 30 runs — because the
  # `concurrency` group now cancels superseded PR runs instead of piling them up. With no queue,
  # one serial job was paying ~8m of wall clock for a slot it did not need to save.
  #
  # The price is the compile done twice: both jobs run compileKotlinIosSimulatorArm64 (~90s).
  # Everything else was already separate — the test binary link and the framework link are
  # different task invocations (see "Build Swift bridge tests"), and that was true inside the
  # single job too. If the macOS queue ever comes back, merge these again; it is the first
  # thing to revert.
  #
  # Both jobs use the JDK the runner image ships rather than actions/setup-java: on macOS that
  # action spent 0.7-1.9m before logging "Resolved Java 21 from tool-cache" — the same JDK it
  # then used. JAVA_HOME_21_arm64 is the runner image's own variable for it. The guard fails
  # loudly if an image update ever drops it, instead of letting Gradle fall back to whatever
  # `java` is on PATH.
  ios-kotlin-tests:
    name: iOS Kotlin Tests (macos, JDK 21)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use the runner's JDK 21
        run: |
          test -d "$JAVA_HOME_21_arm64" || { echo "JAVA_HOME_21_arm64 is not on this image"; exit 1; }
          echo "JAVA_HOME=$JAVA_HOME_21_arm64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_arm64/bin" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      # See "Cache Gradle distribution" in jvm-lint-build for why this is not covered by
      # setup-gradle's own cache.
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # ~/.konan holds the Kotlin/Native toolchain *and* the gSTATIC compiler caches. The test
      # binary's bucket and the framework's are different, so each job keeps its own entry —
      # `-kotlin-` here, `-swift-` in the bridge job.
      #
      # Do NOT add a restore-key broader than this job's own prefix. AMPR-253 added a cross-job
      # "konan-<os>-" key and the bridge job restored the test job's bucket instead: the framework
      # link went 323s (no cache) -> 1208s (wrong bucket) -> 138s (right bucket). A mismatched
      # Konan cache is far worse than none, so a clean miss is the good failure mode here.
      #
      # Keyed on gradle.properties (which carries kotlin.version) and NOT on the module build
      # files. Hashing those would rotate the key on every dependency edit and have main write a
      # fresh ~400MB entry each time — the quota churn that put this repo over its 10GB cache
      # limit before. The tradeoff is that a bucket goes stale as iOS dependencies change and
      # their gSTATIC caches get rebuilt per run; bump kotlin.version or edit gradle.properties to
      # force a refresh.
      #
      # Restore on every branch, save only from main. A per-PR-branch entry was pure quota burn:
      # no other branch can ever read it, and those writes were evicting the main entry that every
      # branch does read.
      - name: Restore Kotlin/Native toolchain
        id: konan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-ios-kotlin-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-ios-kotlin-

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          anthropic_api_key=placeholder
          google_api_key=placeholder
          openai_api_key=placeholder
          EOF

      # 15 minutes, not 25: the step's observed range is 6-9m, and the one time it hung (a main
      # run in October 2026) it sat at the 25m limit. A hang should cost a quarter hour.
      - name: Run iOS simulator tests
        timeout-minutes: 15
        run: ./gradlew :ampere-core:iosSimulatorArm64Test

      - name: Save Kotlin/Native toolchain
        if: github.ref == 'refs/heads/main' && steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-ios-kotlin-${{ hashFiles('gradle.properties') }}

  ios-swift-bridge:
    name: iOS Swift Bridge Tests (macos, JDK 21)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The simulator takes ~5m of mostly-idle wall clock to come up, and AMPR-253 left that fully
      # serial in "Run Swift bridge tests" — 346s of a 638s job. Kick it off first so it overlaps
      # the Gradle setup and the whole xcodebuild step.
      #
      # simctl hands the boot to CoreSimulator and returns, so this does not need backgrounding
      # with '&': there is no child process to outlive the step.
      - name: Start simulator boot
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$UDID" || { echo "No iPhone simulator available"; exit 1; }
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      # See ios-kotlin-tests for why this is not actions/setup-java. The nested Gradle that
      # Xcode's "Compile Kotlin" phase spawns inherits JAVA_HOME from xcodebuild's environment,
      # which is this job's environment.
      - name: Use the runner's JDK 21
        run: |
          test -d "$JAVA_HOME_21_arm64" || { echo "JAVA_HOME_21_arm64 is not on this image"; exit 1; }
          echo "JAVA_HOME=$JAVA_HOME_21_arm64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_arm64/bin" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      # See "Cache Gradle distribution" in jvm-lint-build for why this is not covered by
      # setup-gradle's own cache.
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # This job's own ~/.konan bucket: the framework's gSTATIC caches, not the test binary's.
      # See ios-kotlin-tests for the key discipline; the prefix here must stay distinct.
      #
      # AMPR-244 once had to revert caching ~/.konan on the bridge job because a Gradle step in
      # this job ran concurrently with Xcode's nested Gradle and the two raced on Konan's
      # inter-process lock. There is no other Gradle invocation in this job now — xcodebuild's is
      # the only one — so the lock has one holder.
      - name: Restore Kotlin/Native toolchain
        id: konan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-ios-swift-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-ios-swift-

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          anthropic_api_key=placeholder
          google_api_key=placeholder
          openai_api_key=placeholder
          EOF

      # There used to be a "Link Kotlin framework" step here running
      # :ampere-core:linkDebugFrameworkIosSimulatorArm64 up front, on the premise that xcodebuild's
      # nested Gradle would then find the link UP-TO-DATE. Measured across five consecutive runs,
      # it never did: the standalone link took 8-17m and the nested one re-linked from scratch for
      # another 12-15m in every single run, while only compileKotlinIosSimulatorArm64 came back
      # UP-TO-DATE. The link task's inputs genuinely differ between the two invocations — Xcode's
      # script phase supplies build settings that reach the link task's compiler arguments — so the
      # first link was never reusable and the job was paying for the same work twice.
      #
      # Doing the link once, inside xcodebuild, is the whole of this step's Gradle work: compile
      # (~90s) then link (~5m on a warm Konan cache). If a separately-timed link is ever wanted
      # again, it has to be provably the *same* task invocation, not just the same task name.
      - name: Build Swift bridge tests
        timeout-minutes: 40
        run: |
          xcodebuild build-for-testing \
            -project ampere-ios/ampere-ios.xcodeproj \
            -scheme ampere-ios \
            -destination "id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      # The boot was started at the top of the job; by now it is long finished — the xcodebuild
      # step alone outlasts it. bootstatus just collects it, and returns immediately if the
      # device is already booted.
      - name: Run Swift bridge tests
        timeout-minutes: 15
        run: |
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b || true

          xcodebuild test-without-building \
            -project ampere-ios/ampere-ios.xcodeproj \
            -scheme ampere-ios \
            -destination "id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Save Kotlin/Native toolchain
        if: github.ref == 'refs/heads/main' && steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-ios-swift-${{ hashFiles('gradle.properties') }}

  # Kept as a separate aggregate job under its original name because that name is the required
  # status check on main. The iOS work is two jobs again, but branch protection still looks for
  # this one name.
  ios-tests-status:
    name: iOS Simulator Tests (macos, JDK 21)
    needs: [ changes, ios-kotlin-tests, ios-swift-bridge ]
    runs-on: ubuntu-latest
    if: always()

    steps:
      # This job is the required status check, so it must report on every run — including the
      # documentation-only ones where the iOS jobs are skipped. 'skipped' is a pass here; only
      # 'changes' itself is required to have actually succeeded.
      - name: Check required jobs succeeded
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes: ${{ needs.changes.result }}"
            exit 1
          fi

          for result in "${{ needs.ios-kotlin-tests.result }}" "${{ needs.ios-swift-bridge.result }}"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "ios-kotlin-tests: ${{ needs.ios-kotlin-tests.result }}"
                echo "ios-swift-bridge: ${{ needs.ios-swift-bridge.result }}"
                exit 1
                ;;
            esac
          done
