name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  jvm-lint-build:
    name: JVM Lint + Build (ubuntu, JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          anthropic_api_key=placeholder
          google_api_key=placeholder
          openai_api_key=placeholder
          EOF

      - name: Lint and build JVM/Android modules
        timeout-minutes: 20
        run: ./gradlew ktlintCheck :ampere-core:assemble :ampere-cli:assemble :ampere-compose:assemble :ampere-eval:assemble

  jvm-test:
    name: JVM + Android Tests (${{ matrix.module }}, JDK 21)
    needs: jvm-lint-build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: ampere-core
            tasks: ":ampere-core:jvmTest :ampere-core:testDebugUnitTest"
          - module: ampere-cli
            tasks: ":ampere-cli:jvmTest"
          - module: ampere-compose
            tasks: ":ampere-compose:jvmTest :ampere-compose:testDebugUnitTest"
          - module: ampere-eval
            tasks: ":ampere-eval:jvmTest"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          anthropic_api_key=placeholder
          google_api_key=placeholder
          openai_api_key=placeholder
          EOF

      - name: Run JVM + Android tests
        timeout-minutes: 20
        run: ./gradlew ${{ matrix.tasks }}

  jvm-tests-status:
    name: JVM + Android Tests (ubuntu, JDK 21)
    needs: [ jvm-lint-build, jvm-test ]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check required jobs succeeded
        run: |
          if [ "${{ needs.jvm-lint-build.result }}" != "success" ] || [ "${{ needs.jvm-test.result }}" != "success" ]; then
            echo "jvm-lint-build: ${{ needs.jvm-lint-build.result }}"
            echo "jvm-test: ${{ needs.jvm-test.result }}"
            exit 1
          fi

  ios-tests:
    name: iOS Simulator Tests (macos, JDK 21)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('ampere-ios/**/*.swift', 'ampere-ios/**/project.pbxproj') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          anthropic_api_key=placeholder
          google_api_key=placeholder
          openai_api_key=placeholder
          EOF

      - name: Run iOS simulator tests
        timeout-minutes: 25
        run: ./gradlew :ampere-core:iosSimulatorArm64Test

      # The Kotlin↔Swift Arc bridge (AMPR-243). iosSimulatorArm64Test proves the Kotlin half
      # runs on Native; only xcodebuild proves the Objective-C export is usable from Swift.
      #
      # AMPR-244: build-for-testing (which triggers the Kotlin/Native framework link) and the
      # simulator boot are independent and were previously fully serialized. Kick the boot off
      # in the background before the build so the ~7m link and the ~3m boot overlap instead of
      # stacking.
      - name: Build Swift bridge tests
        timeout-minutes: 20
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$UDID" || { echo "No iPhone simulator available"; exit 1; }
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

          xcrun simctl boot "$UDID" 2>/dev/null &

          xcodebuild build-for-testing \
            -project ampere-ios/ampere-ios.xcodeproj \
            -scheme ampere-ios \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Run Swift bridge tests
        timeout-minutes: 10
        run: |
          xcodebuild test-without-building \
            -project ampere-ios/ampere-ios.xcodeproj \
            -scheme ampere-ios \
            -destination "id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
