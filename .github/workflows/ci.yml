name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  jvm-lint-build:
    name: JVM Lint + Build (ubuntu, JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          anthropic_api_key=placeholder
          google_api_key=placeholder
          openai_api_key=placeholder
          EOF

      - name: Lint and build JVM/Android modules
        timeout-minutes: 20
        run: ./gradlew ktlintCheck :ampere-core:assemble :ampere-cli:assemble :ampere-compose:assemble :ampere-eval:assemble

  jvm-test:
    name: JVM + Android Tests (${{ matrix.module }}, JDK 21)
    needs: jvm-lint-build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: ampere-core
            tasks: ":ampere-core:jvmTest :ampere-core:testDebugUnitTest"
          - module: ampere-cli
            tasks: ":ampere-cli:jvmTest"
          - module: ampere-compose
            tasks: ":ampere-compose:jvmTest :ampere-compose:testDebugUnitTest"
          - module: ampere-eval
            tasks: ":ampere-eval:jvmTest"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          anthropic_api_key=placeholder
          google_api_key=placeholder
          openai_api_key=placeholder
          EOF

      - name: Run JVM + Android tests
        timeout-minutes: 20
        run: ./gradlew ${{ matrix.tasks }}

  ios-tests:
    name: iOS Simulator Tests (macos, JDK 21)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          anthropic_api_key=placeholder
          google_api_key=placeholder
          openai_api_key=placeholder
          EOF

      - name: Run iOS simulator tests
        timeout-minutes: 25
        run: ./gradlew :ampere-core:iosSimulatorArm64Test
