name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The macOS jobs below are the scarcest resource in this repo: the Team plan allows 5 concurrent
# macOS jobs org-wide and each CI run asks for 2 of them. With ~6 runs in flight the queue was
# consistently as long as the running set, so a force-push used to add two more macOS jobs rather
# than replace the two it superseded. Cancel superseded PR runs; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which halves of CI does this change actually need? Only the iOS jobs are gated on this — they
  # are the ones that queue. The ubuntu jobs are cheap and always run, so a wrong answer here can
  # never let an untested Kotlin change through the JVM gate.
  #
  # The list is an ignore-list on purpose: anything not named here counts as iOS-relevant. Adding
  # a path is a decision to stop testing it on iOS, so the failure mode of forgetting to update it
  # is a wasted runner, not a missed regression.
  changes:
    name: Detect iOS-relevant changes
    runs-on: ubuntu-latest

    outputs:
      ios: ${{ steps.filter.outputs.ios }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether iOS jobs need to run
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # A first push to a branch reports an all-zero "before", and a shallow/forced history can
          # leave the base unreachable. Both mean "we cannot tell" -> run the iOS jobs.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "Cannot resolve base commit; running iOS jobs."
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # Paths that cannot affect the Kotlin/Native or Swift build.
          RELEVANT=$(echo "$CHANGED" | grep -Ev \
            -e '^docs/' \
            -e '^\.context/' \
            -e '^assets/' \
            -e '^scripts/' \
            -e '^\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE)' \
            -e '\.md$' \
            -e '^LICENSE' \
            -e '^\.gitignore$' \
            || true)

          if [ -z "$RELEVANT" ]; then
            echo "Documentation-only change; skipping iOS jobs."
            echo "ios=false" >> "$GITHUB_OUTPUT"
          else
            echo "iOS-relevant files changed:"
            echo "$RELEVANT" | sed 's/^/  /'
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

  jvm-lint-build:
    name: JVM Lint + Build (ubuntu, JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Only main writes Gradle caches. The repo was sitting at 10.9GB against a 10GB Actions cache
      # quota, so every new entry evicted an older one and the expensive ~/.konan buckets were gone
      # before the next run could read them. PR branches cannot share cache entries with each other
      # anyway — a PR reads its own ref and main — so writing from PRs bought nothing and cost the
      # quota that made main's entries survivable.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # setup-gradle's Gradle Home cache covers 'caches' and 'notifications' only — the wrapper's
      # distribution is not among them, so every job re-fetched the ~130MB
      # gradle-8.13-bin.zip from services.gradle.org before Gradle could start. That download
      # failed mid-handshake on three consecutive macos runs and took the Swift bridge job with
      # it, and it is dead weight on every healthy run besides.
      #
      # Exact match, no restore-keys: a distribution for a different wrapper version cannot be
      # used, so restoring one would pay the download anyway and churn the cache for nothing. A
      # clean miss is the right failure mode — it costs exactly what today already costs.
      #
      # Jobs that miss together will all try to save the same key; the first wins and the rest
      # log "cache already exists", which is a warning and not a failure.
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          anthropic_api_key=placeholder
          google_api_key=placeholder
          openai_api_key=placeholder
          EOF

      - name: Lint and build JVM/Android modules
        timeout-minutes: 20
        run: ./gradlew ktlintCheck verifyPublishWorkflowCoverage :ampere-core:assemble :ampere-cli:assemble :ampere-compose:assemble :ampere-eval:assemble

  jvm-test:
    name: JVM + Android Tests (${{ matrix.module }}, JDK 21)
    needs: jvm-lint-build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: ampere-core
            tasks: ":ampere-core:jvmTest :ampere-core:testDebugUnitTest"
          - module: ampere-cli
            tasks: ":ampere-cli:jvmTest"
          - module: ampere-compose
            tasks: ":ampere-compose:jvmTest :ampere-compose:testDebugUnitTest"
          - module: ampere-eval
            tasks: ":ampere-eval:jvmTest"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # See "Cache Gradle distribution" in jvm-lint-build for why this is not covered by
      # setup-gradle's own cache.
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          anthropic_api_key=placeholder
          google_api_key=placeholder
          openai_api_key=placeholder
          EOF

      - name: Run JVM + Android tests
        timeout-minutes: 20
        run: ./gradlew ${{ matrix.tasks }}

  jvm-tests-status:
    name: JVM + Android Tests (ubuntu, JDK 21)
    needs: [ jvm-lint-build, jvm-test ]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check required jobs succeeded
        run: |
          if [ "${{ needs.jvm-lint-build.result }}" != "success" ] || [ "${{ needs.jvm-test.result }}" != "success" ]; then
            echo "jvm-lint-build: ${{ needs.jvm-lint-build.result }}"
            echo "jvm-test: ${{ needs.jvm-test.result }}"
            exit 1
          fi

  # Both halves of the iOS surface in ONE macOS job: the Kotlin tests (commonTest/nativeTest
  # compiled and run on Native) and the Kotlin<->Swift Arc bridge (AMPR-243).
  #
  # These used to be two parallel jobs. The Team plan allows 5 concurrent macOS jobs org-wide, so
  # asking for 2 per run capped the repo at 2.5 runs in flight — with ~5 PRs open the macOS half of
  # every run sat queued while the ubuntu half had already gone green. Parallelism *inside* a run
  # was being bought with parallelism *across* runs, at 2x the price.
  #
  # Merging is close to free in wall clock because the two jobs were doing the same work twice.
  # Measured on the runs before this change: kotlin tests 6-10m, swift bridge 20-26m, so the pair
  # cost max(10, 26) = 26m on two runners. Serialised in one job they share a Gradle daemon and a
  # build directory, so iosSimulatorArm64Test's compile of :ampere-core makes xcodebuild's nested
  # Gradle find compileKotlinIosSimulatorArm64 UP-TO-DATE instead of recompiling it. One runner,
  # roughly the same wall clock, and 5 runs can now be in flight instead of 2.
  #
  # Note what is NOT shared: linkDebugFrameworkIosSimulatorArm64 still runs in full under
  # xcodebuild. See the "Build Swift bridge tests" step for why that link is not reusable.
  #
  # Ordering: Kotlin tests first. They are the cheaper signal and a failure there makes the Swift
  # bridge result meaningless anyway, so failing fast on them costs nothing.
  ios-tests:
    name: iOS Tests (macos, JDK 21)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The simulator takes ~5m of mostly-idle wall clock to come up, and AMPR-253 left that fully
      # serial in "Run Swift bridge tests" — 346s of a 638s job. Kick it off first so it overlaps
      # the JDK/Gradle setup, the Kotlin tests and the xcodebuild step.
      #
      # simctl hands the boot to CoreSimulator and returns, so this does not need backgrounding
      # with '&': there is no child process to outlive the step.
      - name: Start simulator boot
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$UDID" || { echo "No iPhone simulator available"; exit 1; }
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # See "Cache Gradle distribution" in jvm-lint-build for why this is not covered by
      # setup-gradle's own cache.
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # ~/.konan holds the Kotlin/Native toolchain *and* the gSTATIC compiler caches — the test
      # binary's bucket and the framework's, which before this change lived in two separate cache
      # entries keyed per job precisely so the two jobs could not overwrite each other. One job
      # means one bucket holding both, so the race is gone and the repo stores 344MB instead of
      # 688MB of it.
      #
      # AMPR-244 tried caching ~/.konan on the bridge job and had to revert it: Xcode's "Compile
      # Kotlin" script phase spawns a second, concurrent Gradle process, and that raced the first
      # one on Konan's inter-process lock. That hazard does not return here — the Kotlin tests and
      # xcodebuild are separate *steps*, never concurrent.
      #
      # Do NOT add a broader restore-key than the one below. AMPR-253 added a cross-job
      # "konan-<os>-" key and the bridge job restored the test job's bucket instead: the framework
      # link went 323s (no cache) -> 1208s (wrong bucket) -> 138s (right bucket). A mismatched
      # Konan cache is far worse than none, so a clean miss is the good failure mode here.
      #
      # Keyed on gradle.properties (which carries kotlin.version) and NOT on the module build
      # files. Hashing those would rotate the key on every dependency edit and have main write a
      # fresh 344MB entry each time — the quota churn that put this repo over its 10GB cache limit
      # before. The tradeoff is that a bucket goes stale as iOS dependencies change and their
      # gSTATIC caches get rebuilt per run; bump kotlin.version or edit gradle.properties to force
      # a refresh.
      #
      # Restore on every branch, save only from main. A per-PR-branch entry was pure quota burn:
      # no other branch can ever read it, and those writes were evicting the main entry that every
      # branch does read.
      - name: Restore Kotlin/Native toolchain
        id: konan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-ios-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-ios-

      - name: Create local.properties
        run: |
          cat > local.properties << 'EOF'
          anthropic_api_key=placeholder
          google_api_key=placeholder
          openai_api_key=placeholder
          EOF

      - name: Run iOS simulator tests
        timeout-minutes: 25
        run: ./gradlew :ampere-core:iosSimulatorArm64Test

      # There used to be a "Link Kotlin framework" step here running
      # :ampere-core:linkDebugFrameworkIosSimulatorArm64 up front, on the premise that xcodebuild's
      # nested Gradle would then find the link UP-TO-DATE. Measured across five consecutive runs,
      # it never did: the standalone link took 8-17m and the nested one re-linked from scratch for
      # another 12-15m in every single run, while only compileKotlinIosSimulatorArm64 came back
      # UP-TO-DATE. The link task's inputs genuinely differ between the two invocations — Xcode's
      # script phase supplies build settings that reach the link task's compiler arguments — so the
      # first link was never reusable and the job was paying for the same work twice.
      #
      # That measurement is also exactly why merging the two macOS jobs pays: the UP-TO-DATE half
      # is the compile, and the step above has now already done it in this same build directory.
      #
      # Doing the link once, inside xcodebuild, roughly halves this step. If a separately-timed
      # link is ever wanted again, it has to be provably the *same* task invocation, not just the
      # same task name.
      - name: Build Swift bridge tests
        timeout-minutes: 40
        run: |
          xcodebuild build-for-testing \
            -project ampere-ios/ampere-ios.xcodeproj \
            -scheme ampere-ios \
            -destination "id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      # The boot was started at the top of the job; by now it is long finished — the Kotlin tests
      # alone outlast it. bootstatus just collects it, and returns immediately if the device is
      # already booted.
      - name: Run Swift bridge tests
        timeout-minutes: 15
        run: |
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b || true

          xcodebuild test-without-building \
            -project ampere-ios/ampere-ios.xcodeproj \
            -scheme ampere-ios \
            -destination "id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Save Kotlin/Native toolchain
        if: github.ref == 'refs/heads/main' && steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-ios-${{ hashFiles('gradle.properties') }}

  # Kept as a separate aggregate job under its original name because that name is the required
  # status check on main. The iOS work is one job now, but branch protection still looks for this.
  ios-tests-status:
    name: iOS Simulator Tests (macos, JDK 21)
    needs: [ changes, ios-tests ]
    runs-on: ubuntu-latest
    if: always()

    steps:
      # This job is the required status check, so it must report on every run — including the
      # documentation-only ones where the iOS job is skipped. 'skipped' is a pass here; only
      # 'changes' itself is required to have actually succeeded.
      - name: Check required jobs succeeded
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes: ${{ needs.changes.result }}"
            exit 1
          fi

          case "${{ needs.ios-tests.result }}" in
            success|skipped) ;;
            *)
              echo "ios-tests: ${{ needs.ios-tests.result }}"
              exit 1
              ;;
          esac
